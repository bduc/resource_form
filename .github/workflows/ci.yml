name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resource_form
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resource_form_test
    steps:
      - uses: actions/checkout@v7
        with:
          path: resource_form
      # actions/checkout requires `path:` to resolve under $GITHUB_WORKSPACE,
      # so the engine this gem depends on has to land in its own workspace
      # subdirectory (../resource_core is one level above and gets rejected)
      # rather than the sibling-checkout layout the Gemfile's `path:` implies
      # locally.
      - uses: actions/checkout@v7
        with:
          repository: bduc/resource_core
          path: resource_core
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: resource_form
      - run: bin/rails db:prepare
      - run: bundle exec rake test
